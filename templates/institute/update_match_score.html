{% extends "institute/base.html" %}
{% load static %}

{% block content %}

<!-- Breadcrumb Section -->
<section class="breadcrumb-section set-bg" data-setbg="{% static 'img/breadcrumb-bg.jpg' %}">
    <div class="container text-center text-white position-relative">
        <h2 class="fw-bold">Update Score</h2>
    </div>
</section>

<!-- Score Update Form -->
<section class="contact-section spad">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg rounded border-0">
                    <div class="card-header bg-primary text-white text-center fw-bold">
                        Update Score
                    </div>
                    <div class="card-body">
                        <h4 class="text-center text-dark fw-bold">
                            {{ match.team1 }} vs {{ match.team2 }}
                        </h4>
                        <hr>

                        <!-- Score Update Form -->
                        <form method="POST" class="needs-validation" novalidate>
                            {% csrf_token %}

                            <div class="mb-3">
                                {{ form.as_p }}
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Update Score</button>
                                <a href="{% url 'match_list' %}" class="btn btn-outline-secondary">Back to Matches</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
