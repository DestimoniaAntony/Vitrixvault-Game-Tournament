{% extends 'institute/base.html' %}
{% load static %}

{% block content %}
<section class="breadcrumb-section set-bg" data-setbg="{% static 'img/breadcrumb-bg.jpg' %}">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="bs-text">
                    <h2>Edit Student</h2>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="contact-section spad">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-lg p-4">
                    <h3 class="text-center mb-4">Edit Student - {{ student.user.first_name }} {{ student.user.last_name }}</h3>
                    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{% url 'student_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</div>
</div>
</div>
</section>
{% endblock %}
